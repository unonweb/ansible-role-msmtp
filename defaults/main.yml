---
# MSMTPRC
# -------
msmtp_msmtprc_template: msmtprc.j2 # -> /etc/msmtprc
msmtp_msmtprc_mode: "u=rw,g=r,o=r"
msmtp_msmtprc_default_account:
msmtp_msmtprc_accounts: [] # list of dicionaries
# account:
# host:
# port: 587
# tls: "on" # <- must be a string!
# tls_starttls: "on" # <- must be a string!
# auth: "on" # <- must be a string!
# user:
# from:
# password:

# ALIASES
# -------
msmtp_aliases: [] # list of dicionaries -> /etc/aliases
# mailer-daemon: "postmaster"
# postmaster: "root"

# MSMTPD
# ------
msmtp_msmtpd_enabled: false